<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="924" height="924" fill="none" viewBox="0 0 924 924"><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@300;900);text{fill:{{ accent_color }};font-family:Inter,sans-serif;font-weight:900}.branding{font-size:20px;letter-spacing:0}.entity-count,.heading{font-size:70px}.album-name,.artist-name,.listen-count{font-size:20px}.album-name{font-weight:900}.album-name,.artist-name{font-family:Inter,sans-serif;color:{{ accent_color }}}.album-name{margin:8px}.artist-name{font-weight:300;margin:0 8px 8px}.entity{font-weight:300;font-size:70px}.genre-count{font-size:42px}.dark{fill:#253127}.overlay{isolation:isolate}.overlay .genre-count{mix-blend-mode:overlay}.value{font-weight:300}</style><defs><mask id="cover-art-mask"><rect width="396" height="396" x="346" y="373" fill="#fff"/></mask></defs><g><g><rect width="924" height="924" fill="{{ background_color }}"/><text x="750" y="897" class="branding">LISTENBRAINZ</text><text x="26" y="43" class="branding">{{ user_name }}</text><text x="26" y="897" class="branding" font-style="italic">#YEARINMUSIC</text><text x="844" y="43" class="branding">2024</text><text class="heading" font-style="italic"><tspan x="26" y="130">YEAR IN</tspan> <tspan x="26" y="210">MUSIC</tspan></text><line x1="26" x2="244" y1="244" y2="244" stroke="{{ accent_color }}" stroke-width="8"/></g>{%- if album_2 -%}<g>{% if album_2[&apos;cover_art&apos;] %}<image width="207" height="207" x="171" y="291" preserveAspectRatio="xMidYMid slice" xlink:href="{{ album_2['cover_art'] }}"/>{% else %}<rect width="207" height="207" x="171" y="291" fill="#FFC93D"/><foreignObject width="207" height="207" x="171" y="498" style="transform:rotate(-90deg);transform-origin:171px 498px"><div xmlns="http://www.w3.org/1999/xhtml"><p class="album-name">{{ album_2[&apos;title&apos;]|upper|e }}</p><p class="artist-name">{{ album_2[&apos;artist&apos;]|upper|e }}</p></div></foreignObject>{% endif %}<text class="listen-count" style="transform:rotate(-90deg);transform-origin:158px 498px" x="158" y="498"><tspan>#2:</tspan> <tspan class="value">{{ &quot;{:,}&quot;.format(album_2[&apos;listen_count&apos;]) }} Listens</tspan></text></g>{%- endif -%}<text x="874" y="214" text-anchor="end"><tspan class="entity-count">{{ &quot;{:,}&quot;.format(artists_count) }}</tspan> <tspan class="entity" dx="16">ARTISTS</tspan></text><text x="874" y="284" text-anchor="end"><tspan class="entity-count">{{ &quot;{:,}&quot;.format(albums_count) }}</tspan> <tspan class="entity" dx="16">ALBUMS</tspan></text><text x="874" y="354" text-anchor="end"><tspan class="entity-count">{{ &quot;{:,}&quot;.format(songs_count) }}</tspan> <tspan class="entity" dx="16">SONGS</tspan></text>{%- set y_start = 850 -%} {%- set y_step = 50 -%} {%- for genre in genres -%}<text x="70" y="{{ y_start - y_step * loop.index0 }}" class="genre-count {% if loop.index0 &gt; 0 %}dark{% endif %}"><tspan class="value">{{ genre[&apos;genre_count_percent&apos;] }}%</tspan> <tspan dx="6">{{ genre[&apos;genre&apos;]|upper }}</tspan></text>{%- endfor -%} {%- if album_1 -%}<g>{% if album_1[&apos;cover_art&apos;] %}<g class="overlay" mask="url(#cover-art-mask)"><image width="396" height="396" x="346" y="373" preserveAspectRatio="xMidYMid slice" xlink:href="{{ album_1['cover_art'] }}"/>{%- for genre in genres -%}<text x="70" y="{{ y_start - y_step * loop.index0 }}" class="genre-count dark"><tspan class="value">{{ genre[&apos;genre_count_percent&apos;] }}%</tspan> <tspan dx="6">{{ genre[&apos;genre&apos;]|upper }}</tspan></text>{%- endfor -%}</g>{% else %}<rect width="396" height="396" x="346" y="373" fill="#EB743B"/><foreignObject width="396" height="396" x="742" y="373" style="transform:rotate(90deg);transform-origin:742px 373px"><div xmlns="http://www.w3.org/1999/xhtml"><p class="album-name">{{ album_1[&apos;title&apos;]|upper|e }}</p><p class="artist-name">{{ album_1[&apos;artist&apos;]|upper|e }}</p></div></foreignObject>{% endif %}<text class="listen-count" style="transform:rotate(90deg);transform-origin:755px 373px" x="755" y="373"><tspan>#1:</tspan> <tspan class="value">{{ &quot;{:,}&quot;.format(album_1[&apos;listen_count&apos;]) }} Listens</tspan></text></g>{%- endif -%}</g></svg>