<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="924" height="924" fill="none" viewBox="0 0 924 924"><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@900);text{fill:#ff0e25;font-family:&apos;Inter&apos;,sans-serif;font-weight:900}.branding{font-size:20px;letter-spacing:0}.artist-name{font-size:85px}</style><g><g><g style="mix-blend-mode:multiply"><rect width="924" height="924" fill="#FFC93D"/><image id="bg" width="924" height="924" xlink:href="{{ bg_image_url }}" style="mix-blend-mode:overlay"/></g><text x="750" y="897" class="branding">LISTENBRAINZ</text><text x="26" y="43" class="branding">{{user_name}}</text><text x="50%" y="43" class="branding" text-anchor="middle">TOP TEN ARTISTS LAST YEAR</text><text x="50%" y="897" class="branding" text-anchor="middle">{{total_artists_count}} ARTISTS</text><text x="26" y="897" class="branding" font-style="italic">#YEARINMUSIC</text><text x="844" y="43" class="branding">2022</text></g><g>{% set y_start = 155 %} {% set gap = 75 %} {% for artist in artists[:10] %}<text x="-20" y="{{ y_start + loop.index0 * gap }}" class="artist-name">{{ artist.artist_name|upper|e }}</text>{% endfor %}</g></g></svg>